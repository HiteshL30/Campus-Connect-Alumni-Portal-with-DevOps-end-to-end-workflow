spring.application.name=alumni-connect
spring.profiles.active=dev

# Shared JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Force clean on checksum mismatch (clean reboot)
spring.flyway.clean-on-validation-error=true
spring.flyway.clean-disabled=false

# HikariCP Tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.leak-detection-threshold=2000
logging.level.com.zaxxer.hikari=DEBUG

server.port=8080

jwt.secret=alumniconnect2024secretkeywhichmustbe256bitslong!
jwt.expiration=86400000

spring.jackson.serialization.fail-on-empty-beans=false

# LLM Configuration
# Options: gemini, llama
llm.provider=gemini

# Gemini Configuration
gemini.api.key=AIzaSyB47AebbsskXx-sNIhy-clcEIVRj2BkWmI

gemini.api.url=https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent

# Llama Configuration (Ollama)
llm.llama.url=http://localhost:11434/api/generate
llm.llama.model=gemma3:1b
llm.llama.timeout=45s

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.llmService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.llmService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.llmService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.llmService.waitDurationInOpenState=60s
resilience4j.circuitbreaker.instances.llmService.permittedNumberOfCallsInHalfOpenState=3

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.metrics.export.simple.enabled=true
