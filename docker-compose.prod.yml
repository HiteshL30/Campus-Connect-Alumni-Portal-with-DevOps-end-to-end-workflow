services:

  # ==========================================
  # MySQL Database
  # ==========================================

  mysql:
    image: mysql:8
    container_name: mysql_db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - backend-network


  # ==========================================
  # Spring Boot Backend
  # ==========================================

  backend:
    image: hlanjewar/campus-connect-backend:latest

    container_name: spring_backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:

      # Spring
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      # Database
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

      # HikariCP
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      DB_MIN_IDLE: ${DB_MIN_IDLE}

      # LLM
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_LLAMA_URL: ${LLM_LLAMA_URL}
      LLM_LLAMA_MODEL: ${LLM_LLAMA_MODEL}
      LLM_LLAMA_TIMEOUT: ${LLM_LLAMA_TIMEOUT}

      # Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}

    expose:
      - "8080"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8080/actuator/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

    networks:
      - frontend-network
      - backend-network


  # ==========================================
  # React Frontend + Nginx
  # ==========================================

  frontend:
    image: hlanjewar/campus-connect-frontend:latest

    container_name: react_frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "80:80"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost/"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - frontend-network


  # ==========================================
  # Networks
  # ==========================================

networks:

  frontend-network:
    driver: bridge

  backend-network:
    driver: bridge


  # ==========================================
  # Persistent MySQL Volume
  # ==========================================

volumes:

  mysql_data: